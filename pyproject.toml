[project]
name = "mex-scrape"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "S", "PTH", "RUF", "SIM", "PL", "D", "T20", "ARG"]
ignore = ["D203", "D213"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["fathom_transcript.py", "scripts"]
