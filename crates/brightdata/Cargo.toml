[package]
name = "brightdata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Product-agnostic: no mex-scrape domain crates (ADR 0006), so other
# projects can adopt this crate. All HTTP goes through http-guard.
[dependencies]
http-guard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
http-guard = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "test-util"] }
