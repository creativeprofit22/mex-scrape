[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Workspace crates
amazon = { path = "crates/amazon" }
api = { path = "crates/api" }
brightdata = { path = "crates/brightdata" }
db = { path = "crates/db" }
domain = { path = "crates/domain" }
http-guard = { path = "crates/http-guard" }
matching = { path = "crates/matching" }
retailers = { path = "crates/retailers" }

# External crates (exact versions resolved in Cargo.lock)
anyhow = "1.0.104"
axum = "0.8.9"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
